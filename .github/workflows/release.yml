name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v1.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      MARKER_QC_SKIP_CAMERA_SCAN: "1"
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify tag version and release inputs
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
          $line = Select-String -LiteralPath pyproject.toml -Pattern '^version\s*=\s*"([^\"]+)"$' | Select-Object -First 1
          if (-not $line) { throw "Project version not found" }
          $version = $line.Matches[0].Groups[1].Value
          if ($tag -ne "v$version") { throw "Tag $tag does not match project version v$version" }
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) { throw "Checked out commit $headCommit does not match $tag ($tagCommit)" }
          foreach ($path in @(
            "MarkerQC.spec",
            "build.ps1",
            "scripts\package_release.ps1",
            "README.md",
            "docs\Руководство оператора.docx",
            "docs\Руководство оператора.pdf"
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release input is missing: $path"
            }
          }
      - name: Ensure release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; refusing to overwrite it" }
          exit 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile modules
        run: python -m compileall -q marker_qc
      - name: Run tests
        run: python -m pytest -q
      - name: Build onedir application
        shell: pwsh
        run: .\build.ps1 -PythonExecutable (Get-Command python).Source -SkipTests
      - name: Verify onedir output
        shell: pwsh
        run: |
          $required = @(
            ".\dist\MarkerQC\MarkerQC.exe",
            ".\dist\MarkerQC\_internal",
            ".\dist\MarkerQC\docs",
            ".\dist\MarkerQC\docs\Руководство оператора.pdf"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Required release file is missing: $path" }
          }
          $releaseDocs = @(Get-ChildItem -LiteralPath ".\dist\MarkerQC\docs" -File)
          if ($releaseDocs.Count -ne 1 -or $releaseDocs[0].Name -ne "Руководство оператора.pdf") {
            throw "Release docs must contain only Руководство оператора.pdf"
          }
          $pdfCopies = @(Get-ChildItem -LiteralPath ".\dist\MarkerQC" -File -Recurse | Where-Object Name -eq "Руководство оператора.pdf")
          if ($pdfCopies.Count -ne 1) { throw "The operator guide must occur exactly once in the release" }
      - name: Smoke test frozen application
        shell: pwsh
        run: |
          $env:MARKER_QC_SMOKE_TEST = "1"
          $env:MARKER_QC_DATA_DIR = Join-Path $env:RUNNER_TEMP "MarkerQC-smoke"
          $process = Start-Process -FilePath ".\dist\MarkerQC\MarkerQC.exe" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Smoke test exit code: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:MARKER_QC_DATA_DIR "smoke-ready.txt"))) { throw "Smoke marker not created" }
          if (-not (Test-Path (Join-Path $env:MARKER_QC_DATA_DIR "marker_qc.sqlite3"))) { throw "User database not created" }
      - name: Package ZIP and checksum
        shell: pwsh
        run: .\scripts\package_release.ps1 -Tag $env:RELEASE_TAG
      - name: Verify release archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archiveName = "MarkerQC-$env:RELEASE_TAG-win64.zip"
          $zip = ".\release\$archiveName"
          $checksum = "$zip.sha256"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Release ZIP not found" }
          if (-not (Test-Path -LiteralPath $checksum)) { throw "SHA-256 file not found" }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zip))
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @("MarkerQC/MarkerQC.exe", "MarkerQC/docs/Руководство оператора.pdf")) {
              if ($required -notin $entries) { throw "Archive entry is missing: $required" }
            }
            if (-not ($entries | Where-Object { $_ -like "MarkerQC/_internal/*" })) {
              throw "Archive does not contain MarkerQC/_internal"
            }
            $docsEntries = @($entries | Where-Object { $_ -like "MarkerQC/docs/*" -and -not $_.EndsWith("/") })
            if ($docsEntries.Count -ne 1 -or $docsEntries[0] -ne "MarkerQC/docs/Руководство оператора.pdf") {
              throw "Archive docs must contain only the PDF operator guide: $($docsEntries -join ', ')"
            }
            $pdfEntries = @($entries | Where-Object { $_ -like "*/Руководство оператора.pdf" })
            if ($pdfEntries.Count -ne 1) { throw "The PDF operator guide must occur exactly once in the archive" }
            $forbidden = @($entries | Where-Object {
              $_ -match '(^|/)(reference_archive|\.venv|build|tests|release)(/|$)' -or
              $_ -match '\.(sqlite3?|db|log|docx)$' -or
              ($_ -notlike 'MarkerQC/_internal/*' -and $_ -match '\.(md|py)$') -or
              $_ -match '^MarkerQC/(settings\.json|images|data|logs)(/|$)'
            })
            if ($forbidden) { throw "Forbidden archive entries: $($forbidden -join ', ')" }
          } finally {
            $archive.Dispose()
          }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $archiveName = "MarkerQC-$tag-win64.zip"
          $notes = @"
          - Обновлено руководство оператора.
          - Упрощён состав документации.
          - В Windows-релиз включена актуальная PDF-инструкция.
          - Функциональность измерений сохранена без изменений.
          "@
          gh release create $tag "release\$archiveName" "release\$archiveName.sha256" --verify-tag --title "Marker QC $tag" --notes $notes
      - name: Verify published GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $release = gh release view $tag --json url,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.isDraft) { throw "Published release is still a draft" }
          if ($release.isPrerelease) { throw "Published release is unexpectedly marked as prerelease" }
          $archiveName = "MarkerQC-$tag-win64.zip"
          $asset = @($release.assets | Where-Object { $_.name -eq $archiveName })
          if ($asset.Count -ne 1 -or [int64]$asset[0].size -le 0) {
            throw "Published release does not contain one non-empty $archiveName asset"
          }
          $downloadDir = Join-Path $env:RUNNER_TEMP "published-release"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          gh release download $tag --pattern $archiveName --dir $downloadDir
          $localHash = (Get-FileHash -LiteralPath ".\release\$archiveName" -Algorithm SHA256).Hash
          $publishedHash = (Get-FileHash -LiteralPath (Join-Path $downloadDir $archiveName) -Algorithm SHA256).Hash
          if ($localHash -ne $publishedHash) { throw "Published ZIP checksum does not match the built ZIP" }
          Write-Output "RELEASE_URL=$($release.url)"
